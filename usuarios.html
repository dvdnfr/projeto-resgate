<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários | Projeto Resgate</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <a class="app-brand" href="dashboard.html">
        <span class="brand-symbol" aria-hidden="true">PR</span>
        <span><strong>Projeto Resgate</strong><small>Acolhimento e esperança</small></span>
      </a>
      <nav class="app-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="produtos.html">Produtos / Estoque</a>
        <a href="saida-produtos.html">Saída de Produtos</a>
        <a class="active" href="usuarios.html">Usuários</a>
        <a href="relatorios.html">Relatórios</a>
      </nav>
      <button class="nav-logout" type="button" data-logout>Logout</button>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Acesso ao sistema</p>
          <h1>Usuários</h1>
        </div>
        <div class="user-chip" id="user-chip">Usuário logado</div>
      </header>

      <section class="content-panel" id="cadastro">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Cadastro</p>
            <h2 id="user-form-title">Cadastrar usuário</h2>
          </div>
          <button class="secondary-button" type="button" id="clear-user-form">Limpar</button>
        </div>
        <form class="data-form" id="user-form">
          <input type="hidden" name="id" />
          <label>Nome<input name="nome" required /></label>
          <label>Usuário<input name="usuario" required /></label>
          <label>Senha<input type="password" name="senha" /></label>
          <label>Tipo de usuário
            <select name="tipo_usuario" required>
              <option value="administrador">Administrador</option>
              <option value="operador">Operador</option>
            </select>
          </label>
          <p class="form-message" id="user-message"></p>
          <button class="primary-button" type="submit">Salvar usuário</button>
        </form>
      </section>

      <section class="content-panel" id="lista">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Lista</p>
            <h2>Usuários cadastrados</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Usuário</th>
                <th>Tipo</th>
                <th>Criado em</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="users-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/usuarios.js"></script>
  </body>
</html>
